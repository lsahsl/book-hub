[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookhub-workers"
version = "0.1.0"
description = "Book Hub processing worker (classifier -> extractor -> normalizer -> scorer)"
requires-python = ">=3.13"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["bookhub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"