services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookhub}
      POSTGRES_USER: ${POSTGRES_USER:-bookhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookhub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    command: ["bundle", "exec", "rails", "server", "-b", "0.0.0.0"]
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-bookhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - ./storage/uploads:/app/storage/uploads
      - ./storage/files:/app/storage/files
      - ./storage/exports:/app/storage/exports
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./workers
    command: ["python", "-m", "bookhub", "poll"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-bookhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-bookhub}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-5}
    volumes:
      - ./storage/uploads:/app/storage/uploads
      - ./storage/files:/app/storage/files
      - ./storage/exports:/app/storage/exports
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: